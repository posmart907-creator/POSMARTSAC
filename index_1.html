<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSMART · Nuestras redes</title>
<meta name="description" content="Encuentra a POSMART Ferretería en Facebook, TikTok y WhatsApp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --posmart-red: #C7292C;
    --posmart-red-deep: #7A1417;
    --ink: #17130F;
    --paper: #FFF7EC;
    --whatsapp: #25D366;
    --whatsapp-dark: #128C4A;
    --facebook: #1877F2;
    --facebook-dark: #0C4DA2;
    --tiktok-cyan: #25F4EE;
    --tiktok-pink: #FE2C55;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family: 'Archivo', sans-serif;
    color: var(--paper);
  }

  body{
    position: relative;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #120c0a;
    overflow-x:hidden;
  }

  .bg{
    position: fixed;
    inset:0;
    background-image: url('fachada.jpg');
    background-size: cover;
    background-position: center 30%;
    filter: saturate(1.05);
    z-index:0;
  }

  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(15,8,6,0.55) 0%, rgba(15,8,6,0.35) 30%, rgba(10,6,5,0.78) 70%, rgba(6,3,2,0.94) 100%);
  }

  .wrap{
    position:relative;
    z-index:2;
    width:100%;
    max-width: 440px;
    padding: 34px 22px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .plate{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background: var(--posmart-red);
    padding:8px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .plate span{
    font-family:'Archivo', sans-serif;
    font-weight:800;
    letter-spacing:.14em;
    font-size:11px;
    text-transform:uppercase;
    color:#FFF3E4;
  }
  .plate .dot{
    width:7px;height:7px;border-radius:50%;
    background:#FFD24C;
    box-shadow:0 0 8px #FFD24C;
  }

  h1{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(44px, 13vw, 68px);
    line-height: 0.92;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    color: #FFFFFF;
    text-shadow: 0 3px 0 var(--posmart-red-deep), 0 10px 24px rgba(0,0,0,0.55);
  }

  .sub{
    font-size: 14.5px;
    font-weight:600;
    color: #F3E3CE;
    letter-spacing:.03em;
    margin: 0 0 30px;
    opacity:0.92;
  }

  .sub b{ color:#FFD24C; font-weight:800; }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding: 16px 20px;
    border-radius: 16px;
    text-decoration:none;
    color:#fff;
    font-weight:800;
    font-size:16.5px;
    letter-spacing:.01em;
    isolation:isolate;
    overflow:hidden;
    box-shadow: 0 10px 24px rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.14);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0,0,0,0.5); }

  /* corrugated sheet-metal accent, echoing the Fibraforte roofing look on the storefront */
  .btn::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;
  }
  .btn::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:6px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.55) 0 3px, rgba(255,255,255,0) 3px 8px);
    opacity:0.5;
    z-index:-1;
  }

  .btn .icon{
    flex:0 0 auto;
    width:42px; height:42px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.18);
    border-radius: 11px;
    backdrop-filter: blur(2px);
  }
  .btn .icon svg{ width:24px; height:24px; display:block; }

  .btn .label{ flex:1; text-align:left; }
  .btn .label small{
    display:block;
    font-weight:600;
    font-size:11.5px;
    opacity:0.85;
    letter-spacing:.02em;
    margin-top:1px;
  }

  .btn .arrow{
    flex:0 0 auto;
    opacity:0.85;
  }

  .btn-wa::before{ background: linear-gradient(135deg, var(--whatsapp) 0%, var(--whatsapp-dark) 100%); }
  .btn-fb::before{ background: linear-gradient(135deg, #3B8CFF 0%, var(--facebook-dark) 100%); }
  .btn-tt::before{ background: linear-gradient(135deg, #121212 0%, #050505 100%); }
  .btn-tt{ box-shadow: 0 0 0 1px rgba(37,244,238,0.35), 0 10px 24px rgba(0,0,0,0.5); }
  .btn-tt .icon{ position:relative; }
  .btn-tt .icon::before{
    content:"";
    position:absolute; inset:-2px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-pink));
    z-index:-1;
    opacity:0.9;
  }

  footer{
    margin-top: 34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  footer .line{
    width:46px; height:3px; border-radius:3px;
    background: linear-gradient(90deg, var(--posmart-red), #FFD24C);
    margin-bottom: 6px;
  }
  footer span{
    font-size: 11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:700;
    color: rgba(255,247,236,0.65);
  }

  @media (max-width:360px){
    .btn{ padding:14px 16px; gap:12px; font-size:15px; }
    .btn .icon{ width:38px; height:38px; }
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true"></div>

  <main class="wrap">
    <div class="plate"><span class="dot"></span><span>Ferretería · Chincha</span></div>

    <h1>POSMART</h1>
    <p class="sub">Materiales de construcción y ferretería &mdash; <b>síguenos y escríbenos</b></p>

    <div class="links">
      <a class="btn btn-wa" href="https://wa.me/51933482945" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 32 32" fill="#25D366" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.02 3C9.4 3 4.03 8.37 4.03 15c0 2.24.61 4.34 1.67 6.14L3 29l8.06-2.65A11.95 11.95 0 0 0 16.02 27C22.64 27 28 21.63 28 15S22.64 3 16.02 3Zm0 21.8c-1.95 0-3.77-.55-5.32-1.5l-.38-.23-4.78 1.57 1.56-4.66-.25-.4A9.7 9.7 0 0 1 5.3 15c0-5.9 4.8-10.7 10.72-10.7 5.9 0 10.7 4.8 10.7 10.7 0 5.92-4.8 10.8-10.7 10.8Z" fill="white"/>
            <path d="M22.1 18.02c-.32-.16-1.9-.94-2.2-1.05-.3-.1-.5-.16-.72.17-.2.32-.84 1.04-1.03 1.26-.19.2-.38.24-.7.08-.32-.16-1.35-.5-2.57-1.6-.95-.85-1.6-1.9-1.78-2.22-.19-.32-.02-.5.14-.66.14-.14.32-.37.48-.56.16-.19.2-.32.32-.53.1-.2.05-.4-.03-.56-.08-.16-.72-1.75-.99-2.4-.26-.62-.53-.54-.72-.55h-.62c-.2 0-.53.08-.8.4-.28.32-1.05 1.03-1.05 2.5s1.08 2.9 1.23 3.1c.16.2 2.13 3.28 5.18 4.6.72.31 1.29.5 1.73.63.73.23 1.39.2 1.9.12.6-.09 1.9-.78 2.16-1.53.27-.75.27-1.4.19-1.53-.08-.13-.28-.2-.6-.36Z" fill="white"/>
          </svg>
        </span>
        <span class="label">WhatsApp<small>Escríbenos ahora</small></span>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="btn btn-fb" href="https://www.facebook.com/photo/?fbid=122195690942770838&set=a.122113382348770838&locale=es_LA" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" fill="#1877F2"/>
            <path d="M20.1 20.4l.66-4.3h-4.13v-2.8c0-1.18.58-2.32 2.43-2.32h1.88v-3.66s-1.71-.29-3.34-.29c-3.41 0-5.64 2.07-5.64 5.8v3.27H8.2v4.3h3.76V29a15 15 0 0 0 4.63 0v-8.6h3.5Z" fill="#fff"/>
          </svg>
        </span>
        <span class="label">Facebook<small>Fotos y novedades</small></span>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="btn btn-tt" href="https://www.tiktok.com/@posmart.ventas?_r=1&_t=ZS-98u7dJnZKKK" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="10" fill="#000"/>
            <path d="M21.6 12.02a5.4 5.4 0 0 1-3.16-1.02v6.72a5.62 5.62 0 1 1-4.85-5.57v2.6a3.03 3.03 0 1 0 2.12 2.89V6h2.55a5.4 5.4 0 0 0 3.34 4.88v1.14Z" fill="#25F4EE"/>
            <path d="M21.02 11.4a5.4 5.4 0 0 1-3.16-1.02v6.72a5.62 5.62 0 1 1-4.85-5.57v2.6a3.03 3.03 0 1 0 2.12 2.89V5.38h2.55a5.4 5.4 0 0 0 3.34 4.88v1.14Z" fill="#FE2C55"/>
            <path d="M21.3 11.7a5.4 5.4 0 0 1-3.15-1.02v6.72a5.62 5.62 0 1 1-4.86-5.57v2.6a3.03 3.03 0 1 0 2.13 2.89V5.68h2.54a5.4 5.4 0 0 0 3.34 4.88v1.14Z" fill="#fff"/>
          </svg>
        </span>
        <span class="label">TikTok<small>@posmart.ventas</small></span>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <footer>
      <div class="line"></div>
      <span>Techos seguros y duraderos</span>
    </footer>
  </main>

</body>
</html>
